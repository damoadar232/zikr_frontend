# == Common configuration (shared by all profiles) ============================
# Profile-specific settings live in application-local.properties and
# application-prod.properties. Activate a profile via
# SPRING_PROFILES_ACTIVE=local  or  SPRING_PROFILES_ACTIVE=prod

spring.application.name=zikrelahi-api
server.port=${PORT:8080}

# Default profile - local when SPRING_PROFILES_ACTIVE is not set
spring.profiles.default=local

# JPA - shared between local and production (Flyway manages the schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# Flyway - shared migration configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Cloudinary credentials are injected from the environment and remain server-side.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Per-media limits are enforced before uploading; multipart limits bound request parsing.
app.media.upload.audio.max-file-size=${AUDIO_MAX_FILE_SIZE:100MB}
app.media.upload.cover.max-file-size=${COVER_IMAGE_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-file-size=${MEDIA_MAX_FILE_SIZE:${AUDIO_MAX_FILE_SIZE:100MB}}
spring.servlet.multipart.max-request-size=${MEDIA_MAX_REQUEST_SIZE:110MB}

# Actuator - expose only the health endpoint, hide sensitive details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never